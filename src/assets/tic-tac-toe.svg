<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#f0f2f5" rx="10"/>
  
  <!-- Grid lines -->
  <line x1="70" y1="40" x2="70" y2="160" stroke="#212529" stroke-width="4" stroke-linecap="round"/>
  <line x1="130" y1="40" x2="130" y2="160" stroke="#212529" stroke-width="4" stroke-linecap="round"/>
  <line x1="40" y1="70" x2="160" y2="70" stroke="#212529" stroke-width="4" stroke-linecap="round"/>
  <line x1="40" y1="130" x2="160" y2="130" stroke="#212529" stroke-width="4" stroke-linecap="round"/>
  
  <!-- O (top left) -->
  <circle cx="55" cy="55" r="15" fill="none" stroke="#007bff" stroke-width="3"/>
  
  <!-- X (top right) -->
  <line x1="130" y1="40" x2="160" y2="70" stroke="#dc3545" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="40" x2="130" y2="70" stroke="#dc3545" stroke-width="3" stroke-linecap="round"/>
  
  <!-- O (middle center) -->
  <circle cx="100" cy="100" r="15" fill="none" stroke="#007bff" stroke-width="3"/>
  
  <!-- X (bottom left) -->
  <line x1="40" y1="130" x2="70" y2="160" stroke="#dc3545" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="130" x2="40" y2="160" stroke="#dc3545" stroke-width="3" stroke-linecap="round"/>
  
  <!-- O (bottom right) -->
  <circle cx="145" cy="145" r="15" fill="none" stroke="#007bff" stroke-width="3"/>
</svg>